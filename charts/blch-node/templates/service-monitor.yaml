{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "blch-node.fullname" . }}-sdk-metrics
  labels:
{{ include "blch-node.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
    {{- include "blch-node.labels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
{{- end }}